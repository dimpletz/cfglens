[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[project]
name = "cfglens"
version = "0.1.0"
description = "Deterministic, secret-safe configuration comparisons with CLI and optional MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Ofelia B Webb"}]
dependencies = ["PyYAML>=6,<7"]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
]
[project.optional-dependencies]
mcp = ["mcp>=1,<2"]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.9,<1", "mcp>=1,<2", "hypothesis>=6.100,<7", "pytest-cov>=6,<8", "twine>=7,<8"]
[project.scripts]
cfglens = "cfglens.cli:main"
cfglens-mcp = "cfglens.mcp_server:main"
[project.urls]
Homepage = "https://github.com/dimpletz/cfglens"
Repository = "https://github.com/dimpletz/cfglens"
[tool.hatch.build.targets.wheel]
packages = ["src/cfglens"]
[tool.pytest.ini_options]
testpaths = ["tests"]
