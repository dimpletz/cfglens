name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade "pip>=26.2.1,<27"
      - run: python -m pip install -e ".[dev]"
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m pytest -q --cov=cfglens.core --cov-branch --cov-report=term-missing
      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.14'
        run: python -m pytest -q

  quality-and-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade "pip>=26.2.1,<27"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel and sdist in isolated environments
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          artifacts = sorted(Path("dist").glob("cfglens-0.1.0-*"))
          assert len(artifacts) == 2, artifacts
          before = str(root / "examples" / "development.yaml")
          after = str(root / "examples" / "production.yaml")

          for artifact in artifacts:
              with tempfile.TemporaryDirectory() as directory:
                  venv = Path(directory) / "venv"
                  subprocess.run([sys.executable, "-m", "venv", str(venv)], check=True)
                  python = venv / "bin" / "python"
                  cli = venv / "bin" / "cfglens"
                  subprocess.run([str(python), "-m", "pip", "install", "--upgrade", "pip>=26.2.1,<27"], check=True)
                  subprocess.run([str(python), "-m", "pip", "install", str(artifact)], check=True)
                  env = os.environ.copy()
                  env.pop("PYTHONPATH", None)
                  import_check = subprocess.run(
                      [str(python), "-c", "import importlib.util; assert importlib.util.find_spec('mcp') is None"],
                      capture_output=True, text=True, env=env, check=False,
                  )
                  assert import_check.returncode == 0, import_check.stderr
                  result = subprocess.run(
                      [str(cli), before, after, "--output", "json"],
                      capture_output=True, text=True, env=env, check=False,
                  )
                  assert result.returncode == 1, result.stderr
                  data = json.loads(
                      result.stdout,
                      parse_constant=lambda token: (_ for _ in ()).throw(ValueError(token)),
                  )
                  assert data["count"] == 5
                  assert "SYNTHETIC_" not in result.stdout
                  assert "[REDACTED]" in result.stdout
                  print(f"{artifact.name}: installed CLI smoke passed")
          PY
