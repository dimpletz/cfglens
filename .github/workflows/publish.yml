name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag to recover, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
jobs:
  build:
    if: (github.event_name == 'release' && github.event.release.prerelease == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade "pip>=26.2.1,<27"
      - name: Verify manually selected tag is an existing published release
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          release_tag = os.environ["RELEASE_TAG"]
          url = f"https://api.github.com/repos/{repository}/releases/tags/{quote(release_tag, safe='')}"
          request = Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urlopen(request) as response:
                  release = json.load(response)
          except HTTPError as error:
              raise SystemExit(f"Could not verify release {release_tag}: HTTP {error.code}") from None
          if release.get("draft") or release.get("prerelease") or release.get("tag_name") != release_tag:
              raise SystemExit("Selected release must exist, be published, and not be a prerelease")
          print(f"Verified existing published release {release_tag}")
          PY
      - name: Verify release tag matches project version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(f"Release tag {actual_tag!r} does not match {expected_tag!r}")
          print(f"Verified release tag {actual_tag}")
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Record artifact checksums
        run: sha256sum dist/cfglens-0.1.0-* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cfglens-dist-${{ env.RELEASE_TAG }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: (github.event_name == 'release' && github.event.release.prerelease == false) || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cfglens
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cfglens-dist-${{ env.RELEASE_TAG }}
          path: .
      - name: Verify downloaded artifact checksums
        run: sha256sum --check SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
