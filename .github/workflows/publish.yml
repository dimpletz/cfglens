name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade "pip>=26.2.1,<27"
      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(f"Release tag {actual_tag!r} does not match {expected_tag!r}")
          print(f"Verified release tag {actual_tag}")
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Record artifact checksums
        run: sha256sum dist/cfglens-0.1.0-* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cfglens-dist-${{ github.event.release.tag_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event.release.prerelease == false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cfglens
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cfglens-dist-${{ github.event.release.tag_name }}
          path: .
      - name: Verify downloaded artifact checksums
        run: sha256sum --check SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
